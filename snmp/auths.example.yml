# SNMP credential overlay — copy this shape; do not commit real secrets.
#
# Named auths only. Discovery lists the names. snmp_exporter loads the
# secrets. SD never emits community / v3 passwords.
#
# How to load (pick one):
#   1) Overlay into the concat snmp.yml the exporter already uses
#      (auths: + modules:). Keep the file mode 0600.
#   2) Separate auths.yml merged at deploy time into --config.file.
#
# Adding a site: duplicate a named block below, then add a discovery group
# that lists that name.

auths:
  # SNMPv2c — common LAN / lab
  public_v2:
    version: 2
    community: public

  # SNMPv1 — older printers / PDUs
  printers_v1:
    version: 1
    community: public

  # SNMPv3 authPriv — production default (SHA-256 + AES)
  dc_v3:
    version: 3
    security_level: authPriv
    username: netops
    password: auth-secret
    priv_password: priv-secret
    auth_protocol: SHA256
    priv_protocol: AES

  # SNMPv3 authNoPriv — devices that cannot do privacy
  edge_v3:
    version: 3
    security_level: authNoPriv
    username: monitor
    password: only-auth
    auth_protocol: SHA256

  # SNMPv3 noAuthNoPriv — username only (rare)
  lab_v3_open:
    version: 3
    security_level: noAuthNoPriv
    username: guest

  # Same USM user, different SNMP context / VRF
  dc_v3_mgmt:
    version: 3
    security_level: authPriv
    username: netops
    password: auth-secret
    priv_password: priv-secret
    auth_protocol: SHA256
    priv_protocol: AES
    context_name: mgmt
