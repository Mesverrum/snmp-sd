# Overlay: second snmp_exporter + sharded Prometheus jobs.
#
#   docker compose -f examples/prometheus-snmp/compose.yaml \
#     -f examples/prometheus-snmp/compose.shard.yaml up -d
#
# Discovery stays one replica. Each job pulls one shard
# (GET /sd/prometheus?shard=&shards=2) and scrapes one exporter.

services:
  snmp-exporter-1:
    image: ${SNMP_EXPORTER_IMAGE:-prom/snmp-exporter:v0.29.0}
    depends_on:
      library:
        condition: service_completed_successfully
    command:
      - --config.file=/library/snmp.yml
      - --snmp.module-concurrency=2
    volumes:
      - snmp_library:/library:ro
    ports:
      - "19117:9116"
    networks: [clab]

  prometheus:
    depends_on:
      - snmp-discovery
      - snmp-exporter
      - snmp-exporter-1
    volumes:
      - ./prometheus-sharded.yml:/etc/prometheus/prometheus.yml:ro
