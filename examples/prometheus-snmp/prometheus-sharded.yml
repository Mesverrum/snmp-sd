# Two exporters, two shards. Discovery stays a singleton.
# Use with compose.shard.yaml.
#
#   docker compose -f examples/prometheus-snmp/compose.yaml \
#     -f examples/prometheus-snmp/compose.shard.yaml up -d

global:
  scrape_interval: 30s

scrape_configs:
  - job_name: snmp-hot-0
    scrape_interval: 60s
    scrape_timeout: 50s
    metrics_path: /snmp
    http_sd_configs:
      - url: http://snmp-discovery:9780/sd/prometheus?shard=0&shards=2
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [snmp_tier]
        regex: hot
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [device_name]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: snmp-hot-1
    scrape_interval: 60s
    scrape_timeout: 50s
    metrics_path: /snmp
    http_sd_configs:
      - url: http://snmp-discovery:9780/sd/prometheus?shard=1&shards=2
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [snmp_tier]
        regex: hot
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [device_name]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter-1:9116

  - job_name: snmp-cold-0
    scrape_interval: 2m
    scrape_timeout: 90s
    metrics_path: /snmp
    http_sd_configs:
      - url: http://snmp-discovery:9780/sd/prometheus?shard=0&shards=2
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [snmp_tier]
        regex: cold
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [device_name]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: snmp-cold-1
    scrape_interval: 2m
    scrape_timeout: 90s
    metrics_path: /snmp
    http_sd_configs:
      - url: http://snmp-discovery:9780/sd/prometheus?shard=1&shards=2
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [snmp_tier]
        regex: cold
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [device_name]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter-1:9116
